name: CI

# PR-only: this used to also run on every push to main, which meant it ran a
# second time (redundantly) right after the PR that already ran it merged.
# The actual gate on main is the required-status-check branch protection
# rule, not this trigger — a merge only lands once the check has passed on
# the PR itself.
on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Lint, types, format & tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # No version here: corepack picks up the packageManager pin in package.json.
            - name: Enable corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm types:check

            - name: Check formatting
              run: pnpm prettier:check

            # Every test is pure logic today, so no database service is needed.
            - name: Test
              run: pnpm test:run --coverage

            - name: Build
              run: pnpm build
