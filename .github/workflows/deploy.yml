name: Deploy

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Cloning repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Push to dokku
              uses: dokku/github-action@v1.10.0
              with:
                  git_remote_url: 'ssh://dokku@46.62.135.107:22/office-pong'
                  ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
